services:
  postgres:
    image: postgres:16
    container_name: shifts-postgres
    environment:
      POSTGRES_DB: shifts
      POSTGRES_USER: shifts_user
      POSTGRES_PASSWORD: shifts_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifts_user -d shifts"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: shifts-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
  mailpit:
    image: axllent/mailpit
    container_name: shits-mailpit
    ports:
      - "8025:8025" # interface web
      - "1025:1025" # SMTP
      
volumes:
  postgres_data:
  keycloak_data: