spring:
    application:
        name: shifts

    datasource:
        url: jdbc:postgresql://localhost:5433/shifts
        username: shifts_user
        password: shifts_pass

    jpa:
        hibernate:
            ddl-auto: validate # Hibernate só valida, quem cria é o Flyway
        open-in-view: true     #boa prática: evita consultas "escondidas" na camada web
        properties:
            hibernate:
                jdbc:
                    timezone: UTC   # guardamos tudo em UTC
    
    flyway:
        enabled: true
        locations: classpath:db/migration
    
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8180/realms/shifts
    
server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health, info